<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d6f"/>
      <stop offset="1" stop-color="#ff3b3b"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="1" y="1" width="898" height="228" rx="10" fill="#0a0a0a" stroke="#ff2d6f" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="1" y="1" width="898" height="34" rx="10" fill="#111111"/>
  <rect x="1" y="25" width="898" height="10" fill="#111111"/>
  <line x1="1" y1="35" x2="899" y2="35" stroke="#ff2d6f" stroke-opacity="0.2"/>
  <circle cx="24" cy="18" r="6" fill="#ff3b3b"/>
  <circle cx="44" cy="18" r="6" fill="#ffb454"/>
  <circle cx="64" cy="18" r="6" fill="#22d37f"/>
  <text x="450" y="23" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="13" fill="#8b8b8b">chetan@bengaluru — zsh</text>

  <!-- prompt line -->
  <text x="36" y="78" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="16">
    <tspan fill="#22d37f">➜</tspan>
    <tspan fill="#8b8b8b" dx="8">~</tspan>
    <tspan fill="#ff2d6f" dx="10">whoami</tspan>
  </text>

  <!-- name -->
  <text x="34" y="130" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="42" font-weight="700" fill="url(#glow)" letter-spacing="1">CHETAN RAGHUVANSHI</text>

  <!-- subtitle -->
  <text x="36" y="164" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="16" fill="#c9c9c9">agent infra <tspan fill="#ff2d6f">·</tspan> observability <tspan fill="#ff2d6f">·</tspan> multi-agent systems <tspan fill="#ff2d6f">·</tspan> solana <tspan fill="#ff2d6f">·</tspan> cursed weekend builds</text>

  <!-- second prompt + cursor -->
  <text x="36" y="202" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="16">
    <tspan fill="#22d37f">➜</tspan>
    <tspan fill="#8b8b8b" dx="8">~</tspan>
  </text>
  <rect x="86" y="189" width="11" height="17" fill="#ff2d6f">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- CRT scanlines -->
  <rect x="1" y="36" width="898" height="193" fill="url(#scan)" rx="0"/>
</svg>
